name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  host:
    name: Native host (build, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo build --release --manifest-path host/Cargo.toml
      - run: cargo test --release --manifest-path host/Cargo.toml
      - run: cargo clippy --release --manifest-path host/Cargo.toml -- -D warnings
      - name: Package host
        run: |
          mkdir -p dist
          tar -C host/target/release -czf dist/phone-passkeys-host-linux-x86_64.tar.gz phone-passkeys-host
      - uses: actions/upload-artifact@v4
        with:
          name: host-linux-x86_64
          path: dist/phone-passkeys-host-linux-x86_64.tar.gz

  extension:
    name: Extension (tests, lint, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/page-js-test.mjs
      - run: npx --yes web-ext@10 lint --source-dir extension --no-input
      - run: python3 tools/build-xpi.py extension dist/phone-passkeys-unsigned.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: extension-unsigned
          path: dist/phone-passkeys-unsigned.xpi

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/phone-passkeys-host-linux-x86_64.tar.gz
            dist/phone-passkeys-unsigned.xpi
          generate_release_notes: true
