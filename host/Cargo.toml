[package]
name = "phone-passkeys-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Native messaging host for the Phone Passkeys browser extension: runs WebAuthn hybrid (phone QR code) ceremonies with libwebauthn"
publish = false

[[bin]]
name = "phone-passkeys-host"
path = "src/main.rs"

[dependencies]
libwebauthn = { version = "0.11.0", features = ["reqwest-related-origins-source"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
psl = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
