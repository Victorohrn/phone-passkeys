[package]
name = "libwebauthn"
description = "FIDO2 (WebAuthn) and FIDO U2F platform library for Linux written in Rust "
version = "0.11.0"
authors = [
    "Alfie Fresta <afresta@noentropy.org>",
    "Martin Sirringhaus <martin.sirringhaus@suse.com>",
    "Isaiah Inuwa <isaiah.inuwa@gmail.com>",
]
edition = "2021"
rust-version = "1.88"
license = "LGPL-2.1-or-later"
readme = "../README.md"
homepage = "https://github.com/linux-credentials"
repository = "https://github.com/linux-credentials/libwebauthn"
resolver = "2"

[lib]
name = "libwebauthn"
path = "src/lib.rs"

# docs.rs builds with default features only, which omits the NFC transport.
# Document it too. libnfc is not available in the docs.rs build environment, so
# the libnfc backend is left out and NFC is documented through the pcsc backend.
[package.metadata.docs.rs]
features = ["nfc-backend-pcsc"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
nfc = ["apdu-core", "apdu"]
nfc-backend-pcsc = ["nfc", "dep:pcsc"]
nfc-backend-libnfc = [
  "nfc",
  "nfc1-sys",
  "nfc1",
]
# Exposes the `HidPipeBackend` trait and `virtual_device()` constructor so that
# external crates (e.g. libwebauthn-tests) can plug in a virtual HID transport
# for end-to-end tests.
virt = []
# Provides the reqwest-backed HttpClient and ReqwestRelatedOriginsSource. Off by
# default so the core crate stays HTTP-client-free. Consumers that want the
# default fetch opt in, others implement HttpClient or RelatedOriginsSource.
reqwest-related-origins-source = ["dep:reqwest"]

[dependencies]
base64-url = "3.0.0"
dbus = "0.9.5"
tracing = "0.1.29"
idna = "1.0.3"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
publicsuffix = "2.3"
url = "2.5"
http = "1"
maplit = "1.0.2"
sha2 = "0.10.2"
uuid = { version = "1.5.0", features = ["serde", "v4"] }
async-trait = "0.1.92"
futures = "0.3.5"
tokio = { version = "1.45", features = ["full"] }
serde = "1.0.110"
serde_cbor_2 = "0.13"
serde-indexed = "0.2.0"
serde_derive = "1.0.123"
serde_repr = "0.1.6"
serde_bytes = "0.11.5"
num-traits = "0.2"
num-derive = "0.4.1"
byteorder = "1.3.4"
num_enum = "0.7.1"
x509-parser = "0.17.0"
time = "0.3.35"
curve25519-dalek = "4.1.3"
hex = "0.4.3"
mockall = "0.13.1"
hidapi = { version = "2.4.1", default-features = false, features = [
    "linux-static-hidraw",
] }
bitflags = "2.4.1"
rand = "0.8.5"
p256 = { version = "0.13.2", features = ["ecdh", "arithmetic", "serde"] }
cosey = "0.4.0"
spki = { version = "0.7", default-features = false, features = ["alloc"] }
der = { version = "0.7", default-features = false, features = ["alloc", "derive", "oid"] }
aes = "0.8.2"
aes-gcm = "0.10"
flate2 = "1.0"
hmac = "0.12.1"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
text_io = "0.1"
tokio-stream = "0.1"
ctap-types = { version = "0.5.0" }
btleplug = "0.11.7"
pxp = "0.1.0"
thiserror = "2.0.12"
serde_json = "1.0.141"
apdu-core = { version = "0.4.0", optional = true }
apdu = { version = "0.4.0", optional = true }
pcsc = { version = "2.9.0", optional = true }
nfc1 = { version = "0.7.1", optional = true, default-features = false }
nfc1-sys = { version = "0.3.9", optional = true, default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "http2",
    "stream",
    "charset",
], optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3.3", features = ["env-filter"] }
qrcode = "0.14.1"
# For turning on logging in unittests
test-log = { version = "0.2" }

